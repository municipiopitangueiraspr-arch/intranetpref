<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intranet · Gestão Pitangueiras</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />


    <!-- Font Awesome 6 -->








<script src="shared/js/acessibilidade-intranet.js" defer></script>
  <link rel="stylesheet" href="shared/css/intranet-global.css?v=20261005-fontawesome-local-1">
</head>
  <body data-intranet-module="plataforma" data-intranet-page="index">
    <!-- ========== MODAL DE LOGIN ========== -->
    <div class="modal-overlay" id="loginModalOverlay">
      <div class="modal-login">
        <div class="modal-login-header">
          <div class="brasao-mini"><img src="brasao-pref.png" alt="Brasão da Prefeitura de Pitangueiras" /></div>
          <h2>Intranet Municipal</h2>
          <p>Acesso restrito a servidores autorizados</p>
        </div>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="loginEmail">E-mail</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-envelope"></i></span>
              <input
                type="email"
                id="loginEmail"
                class="form-input"
                placeholder="seu.email@prefeitura.gov.br"
                required
                autocomplete="email"
                aria-label="seu.email@prefeitura.gov.br"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginSenha">Senha</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-lock"></i></span>
              <input
                type="password"
                id="loginSenha"
                class="form-input"
                placeholder="••••••••"
                required
                autocomplete="current-password"
                aria-label="Senha"
              />
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="btnEntrar">
            <i class="fas fa-arrow-right-to-bracket"></i> Entrar
          </button>
        </form>
        <button type="button" class="btn btn-primary intranet-style-6e24e007eb" id="btnGoogle">
          <i class="fab fa-google"></i> Entrar com Google
        </button>
        <button type="button" class="btn btn-secondary intranet-style-4bdb2fcf81" id="btnSolicitarAcesso">
          Solicitar Acesso
        </button>
        <div class="modal-footer-link">
          <a
            href="#"
            onclick="
              event.preventDefault();
              showNotification(
                'info',
                'Esqueceu a senha?',
                'Entre em contato com o suporte de TI para redefinir sua senha.',
              );
            "
          >
            Esqueceu a senha?
          </a>
        </div>
      </div>
    </div>

    <!-- CONTÊINER DE NOTIFICAÇÕES -->
    <div class="notification-center" id="notificationCenter"></div>

    <!-- Supabase SDK e lógica -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <script type="module">
import { supabase } from "./shared/js/supabase.js";
      // Configuração do Supabase
      // ============================================
      // SISTEMA DE NOTIFICAÇÕES
      // ============================================
      window.showNotification = function (
        type,
        title,
        message,
        duration = 4000,
      ) {
        const container = document.getElementById("notificationCenter");
        const icons = { success: "fa-circle-check", error: "fa-circle-xmark", warning: "fa-triangle-exclamation", info: "fa-circle-info" };
        const toast = document.createElement("div");
        toast.className = `notification-toast notification-${type}`;
        toast.innerHTML = `
          <span class="notification-icon"><i class="fas ${icons[type] || icons.info}"></i></span>
          <div class="notification-content">
            <div class="notification-title">${title}</div>
            <div class="notification-message">${message}</div>
          </div>
          <button class="notification-close" onclick="this.parentElement.remove()" type="button">✕</button>
        `;
        container.appendChild(toast);
        if (duration > 0) {
          setTimeout(() => {
            if (toast.parentElement) {
              toast.classList.add("removing");
              setTimeout(() => toast.remove(), 300);
            }
          }, duration);
        }
        return toast;
      };

      // ============================================
      // MODAL DE CONFIRMAÇÃO
      // ============================================
      window.showConfirm = function (title, message, onConfirm) {
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="modal-confirm">
            <div class="modal-confirm-icon"><i class="fas fa-circle-question"></i></div>
            <h3>${title}</h3>
            <p>${message}</p>
            <div class="modal-confirm-actions">
              <button class="btn btn-secondary" id="cancelBtn" type="button">Cancelar</button>
              <button class="btn btn-primary" id="confirmBtn" type="button">Confirmar</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        const closeModal = () => {
          overlay.style.opacity = "0";
          setTimeout(() => overlay.remove(), 200);
        };

        overlay
          .querySelector("#cancelBtn")
          .addEventListener("click", closeModal);
        overlay.querySelector("#confirmBtn").addEventListener("click", () => {
          closeModal();
          if (typeof onConfirm === "function") onConfirm();
        });
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) closeModal();
        });
        return overlay;
      };

      // ============================================
      // AUTH GUARD (importado dinamicamente)
      // ============================================
      let AuthGuard = null;

      async function carregarAuthGuard() {
        if (AuthGuard) return AuthGuard;
        try {
          const mod = await import("./shared/js/auth-guard.js");
          AuthGuard = mod.AuthGuard || mod.default;
          return AuthGuard;
        } catch (err) {
          console.warn(
            "[Login] AuthGuard não disponível, usando fallback:",
            err,
          );
          return null;
        }
      }

      /**
       * Decide o destino do usuário após autenticação bem-sucedida.
       * Usa o AuthGuard se disponível; caso contrário, vai para a intranet.
       */
      async function decidirDestino() {
        const guard = await carregarAuthGuard();

        if (guard) {
          try {
            const resultado = await guard.protegerRota({
              permitirOnboarding: false,
              registrarAcesso: true,
            });

            if (!resultado.ok) {
              // O guard já redirecionou (para onboarding ou login)
              return;
            }

            if (resultado.precisaOnboarding) {
              window.location.href = guard.ROTAS.ONBOARDING;
              return;
            }

            window.location.href = guard.ROTAS.INTRANET;
            return;
          } catch (err) {
            console.error("[Login] Erro no AuthGuard:", err);
            // Cai no fallback abaixo
          }
        }

        // Fallback: sem guard, vai direto para intranet
        window.location.href = "intranet.html";
      }

      // ============================================
      // FUNÇÃO DE LOGIN - REDIRECIONA VIA GUARD
      // ============================================
      async function fazerLogin(email, senha) {
        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password: senha,
          });
          if (error) throw new Error(error.message);

          // Buscar dados do usuário na tabela 'usuarios'
          const { data: usuario, error: userError } = await supabase
            .from("usuarios")
            .select("id, nome, email, perfil, orgao_id, ativo")
            .eq("uuid", data.user.id)
            .single();

          if (userError || !usuario) {
            await supabase.auth.signOut();
            throw new Error(
              "Usuário não possui perfil no sistema. Contate o administrador.",
            );
          }

          if (usuario.ativo === false) {
            await supabase.auth.signOut();
            throw new Error(
              "Seu usuário está inativo. Contate o administrador.",
            );
          }

          // Notifica sucesso
          window.showNotification(
            "success",
            "Autenticado",
            `Bem-vindo, ${usuario.nome}! Redirecionando...`,
          );

          // Pequeno delay para a notificação aparecer,
          // depois o guard decide o destino correto
          setTimeout(async () => {
            await decidirDestino();
          }, 900);
        } catch (err) {
          window.showNotification(
            "error",
            "Falha na autenticação",
            err.message,
          );
          console.error(err);
        }
      }

      async function entrarComGoogle() {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: new URL("./index.html", window.location.href).href },
        });
        if (error) window.showNotification("error", "Google não configurado", "O provedor Google precisa ser habilitado no Supabase antes do primeiro uso.");
      }

      // ============================================
      // VERIFICAR SESSÃO EXISTENTE
      // ============================================
      async function verificarSessaoExistente() {
        const {
          data: { session },
        } = await supabase.auth.getSession();

        if (session) {
          const { data: usuario } = await supabase
            .from("usuarios")
            .select("id, ativo")
            .eq("uuid", session.user.id)
            .maybeSingle();
          if (!usuario) {
            window.location.href = "acesso.html";
            return;
          }
          await decidirDestino();
        } else {
          // Mostrar modal de login
          document.getElementById("loginModalOverlay").style.display = "flex";
          document.getElementById("loginEmail").focus();
        }
      }

      // ============================================
      // EVENTO DE SUBMIT DO FORMULÁRIO DE LOGIN
      // ============================================
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const senha = document.getElementById("loginSenha").value.trim();
          if (!email || !senha) {
            window.showNotification(
              "warning",
              "Campos obrigatórios",
              "Preencha e-mail e senha.",
            );
            return;
          }
          await fazerLogin(email, senha);
        });

      document.getElementById("btnGoogle").addEventListener("click", entrarComGoogle);
      document.getElementById("btnSolicitarAcesso").addEventListener("click", () => {
        window.location.href = "acesso.html";
      });

      // ============================================
      // INICIALIZAÇÃO
      // ============================================
      document.addEventListener("DOMContentLoaded", async () => {
        await verificarSessaoExistente();
      });
    </script>
  </body>
</html>
