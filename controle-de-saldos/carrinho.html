<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Redirecionando · Meu Carrinho · Gestão de Atas</title>

    <!-- ============================================================ -->
    <!-- REDIRECT AUTOMÁTICO                                          -->
    <!-- ------------------------------------------------------------ -->
    <!-- A página standalone do carrinho foi REMOVIDA na refatoração  -->
    <!-- da Opção A. Agora o carrinho é uma VIEW SPA dentro do        -->
    <!-- Painel Administrativo (gestao-atas.html#carrinho).            -->
    <!--                                                              -->
    <!-- Este arquivo é mantido apenas para:                          -->
    <!--   · não quebrar bookmarks/links antigos                      -->
    <!--   · redirecionar automaticamente para o destino correto      -->
    <!-- ============================================================ -->

    <!-- Redirecionamento instantâneo via meta refresh (fallback) -->
    <meta http-equiv="refresh" content="0; url=gestao-atas.html#carrinho" />

    <!-- Font Awesome (para o ícone do fallback visual) -->


    <!-- ============================================================ -->
    <!-- DESIGN SYSTEM COMPARTILHADO DA INTRANET                       -->
    <!-- Fornece variáveis CSS + reset + body base                     -->
    <!-- ============================================================ -->



    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />










<script src="../shared/js/acessibilidade-intranet.js" defer></script>
  <link rel="stylesheet" href="../shared/css/intranet-global.css?v=20261004-unified-5">
  <link rel="stylesheet" href="./css/atas-saldos-pedidos-redesign.css?v=20261005-1">
</head>
  <body data-intranet-module="atas" data-intranet-page="controle-de-saldos-carrinho">
    <!-- ============================================ -->
    <!-- CARD DE FALLBACK (visível por milissegundos) -->
    <!-- ============================================ -->
    <div class="redirect-card">
      <div class="redirect-icon">
        <i class="fas fa-shopping-cart"></i>
      </div>

      <h1>
        <i class="fas fa-arrow-right"></i>
        Redirecionando...
      </h1>

      <p>
        O carrinho agora faz parte do Painel Administrativo. Você será
        redirecionado automaticamente para a nova localização.
      </p>

      <div class="redirect-progress">
        <div class="redirect-progress-bar"></div>
      </div>

      <a href="gestao-atas.html#carrinho" class="btn-ir-agora">
        <i class="fas fa-external-link-alt"></i>
        Ir agora
      </a>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPT DE REDIRECIONAMENTO                   -->
    <!-- Executa imediatamente, antes do meta refresh -->
    <!-- ter chance de disparar, garantindo redirect   -->
    <!-- instantâneo mesmo em navegadores antigos.     -->
    <!-- ============================================ -->
    <script>
      // Preserva a intenção de navegação: se o usuário tiver chegado
      // aqui por um hash específico (#carrinho, #pedidos, etc.),
      // ainda é redirecionado para a view correta do sistema.
      (function () {
        var destino = "gestao-atas.html#carrinho";
        // window.location.replace não deixa a página atual no histórico,
        // então o botão "voltar" não traz o usuário de volta pra cá.
        window.location.replace(destino);
      })();
    </script>

    <!-- ============================================================ -->
    <!-- FALLBACK FINAL (NOSCRIPT)                                    -->
    <!-- Caso JavaScript esteja desabilitado, o meta refresh já        -->
    <!-- cuidou do redirecionamento. Nada extra é necessário.          -->
    <!-- ============================================================ -->
    <noscript>
      <div

       class="intranet-style-d5b246cb5c">
        Se você não for redirecionado automaticamente, clique em
        <a href="gestao-atas.html#carrinho" class="intranet-style-4b6ea1d047">
          Ir agora
        </a>
        .
      </div>
    </noscript>
  </body>
</html>
