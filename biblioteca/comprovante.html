<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comprovante · Biblioteca Municipal</title>

    <!-- Font Awesome 6 -->








<script src="../shared/js/acessibilidade-intranet.js" defer></script>
  <link rel="stylesheet" href="../shared/css/intranet-global.css?v=20261005-fontawesome-local-1">
</head>
  <body data-intranet-module="biblioteca" data-intranet-page="biblioteca-comprovante">
    <!-- ============ BARRA DE AÇÕES (escondida no print) ============ -->
    <div class="barra-acoes intranet-style-4e5f218e6a" id="barraAcoes">
      <div class="info-arquivo">
        <i class="fas fa-file-invoice"></i>
        <span id="infoArquivo">Carregando...</span>
      </div>
      <div class="botoes">
        <button
          class="btn btn-secondary"
          id="btnToggleVias"
          title="Alternar entre 1 e 2 vias"
         type="button">
          <i class="fas fa-copy"></i> <span id="txtToggleVias">2 vias</span>
        </button>
        <button class="btn btn-azul" id="btnVoltar" title="Voltar" type="button">
          <i class="fas fa-arrow-left"></i> Voltar
        </button>
        <button
          class="btn btn-primary"
          id="btnImprimir"
          title="Imprimir (Ctrl+P)"
         type="button">
          <i class="fas fa-print"></i> Imprimir
        </button>
      </div>

    <!-- ============ ESTADO CARREGANDO ============ -->
    <div class="estado-carregando" id="estadoCarregando">
      <div class="spinner"></div>
      <p class="intranet-style-815a44a454">Carregando comprovante...</p>
    </div>

    <!-- ============ ESTADO DE ERRO ============ -->
    <div class="estado-erro intranet-style-4e5f218e6a" id="estadoErro">
      <i class="fas fa-circle-exclamation"></i>
      <h2 id="tituloErro">Não foi possível carregar o comprovante</h2>
      <p id="mensagemErro">
        O empréstimo informado não existe ou você não tem permissão para
        visualizá-lo.
      </p>
      <button
        class="btn btn-primary intranet-style-956457b5c0"

        onclick="
          window.close();
          history.back();
        "
       type="button">
        <i class="fas fa-arrow-left"></i> Voltar
      </button>
    </div>

    <!-- ============ CONTAINER DAS VIAS ============ -->
    <div id="containerVias"></div>

    <!-- ============ SUPABASE SDK ============ -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <script type="module">
import { supabase } from "../shared/js/supabase.js";
      // ============================================
      // CONFIG SUPABASE
      // ============================================
      // ============================================
      // ESTADO
      // ============================================
      let emprestimo = null;
      let atendente = null;
      let config = { nome_biblioteca: "Biblioteca Municipal" };
      let totalVias = 2; // padrão: 2 vias (biblioteca + leitor)

      // ============================================
      // HELPERS
      // ============================================
      function escaparHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatarData(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (isNaN(d.getTime())) return "—";
        return d.toLocaleDateString("pt-BR");
      }

      function formatarDataHora(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (isNaN(d.getTime())) return "—";
        return d.toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function diaSemana(iso) {
        if (!iso) return "";
        const d = new Date(iso + "T00:00:00");
        if (isNaN(d.getTime())) return "";
        return d.toLocaleDateString("pt-BR", { weekday: "long" });
      }

      function hojeISO() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      function iniciais(nome) {
        if (!nome) return "?";
        const p = nome.trim().split(/\s+/);
        if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
        return (p[0][0] + p[p.length - 1][0]).toUpperCase();
      }

      function labelEstado(e) {
        const map = {
          NOVO: "Novo",
          BOM: "Bom",
          REGULAR: "Regular",
          DANIFICADO: "Danificado",
          PERDIDO: "Perdido",
        };
        return map[e] || e || "—";
      }

      // ============================================
      // BUSCA DE DADOS
      // ============================================
      async function carregarConfiguracoes() {
        const { data } = await supabase
          .from("bib_configuracoes")
          .select("nome_biblioteca, orgao_responsavel_id")
          .eq("id", 1)
          .maybeSingle();
        if (data) config = { ...config, ...data };
      }

      async function carregarEmprestimo(idParam) {
        let query = supabase.from("bib_emprestimos").select(
          `
          id, codigo, status, data_retirada, prazo_devolucao, renovacoes,
          observacoes, created_at,
          leitor: bib_leitores ( id, nome, codigo_carteirinha, cpf, telefone, email, endereco, numero, bairro, cidade, uf, tipo_leitor ),
          usuario: usuarios ( id, nome, cargo ),
          itens: bib_emprestimo_itens (
            id, data_devolucao, dias_atraso, estado_devolucao, observacoes,
            exemplar: bib_exemplares ( id, codigo, estado_conservacao, situacao,
              livro: bib_livros ( id, titulo, isbn, ano_publicacao,
                autores: bib_livro_autores ( autor: bib_autores ( nome ) )
              ),
              prateleira: bib_prateleiras ( numero, estante: bib_estantes ( codigo ) )
            )
          )
        `,
        );

        // Aceita id numérico ou código (EMP-xxxxxx)
        if (/^\d+$/.test(idParam)) {
          query = query.eq("id", parseInt(idParam));
        } else {
          query = query.eq("codigo", idParam.toUpperCase());
        }

        const { data, error } = await query.maybeSingle();
        if (error) throw error;
        if (!data) throw new Error("Empréstimo não encontrado");

        return data;
      }

      // ============================================
      // DETECÇÃO DE TIPO: EMPRÉSTIMO OU DEVOLUÇÃO
      // ============================================
      function analisarEstado(emp) {
        const itens = emp.itens || [];
        const total = itens.length;
        const devolvidos = itens.filter((i) => i.data_devolucao).length;
        const pendentes = total - devolvidos;

        // Tipo: se todos devolvidos → comprovante de devolução total
        //        se nenhum devolvido → comprovante de empréstimo
        //        se parcial → comprovante misto (mostra empréstimo + devolução parcial)
        let tipo = "emprestimo";
        if (total > 0 && devolvidos === total) {
          tipo = "devolucao";
        } else if (devolvidos > 0) {
          tipo = "misto";
        }

        return { tipo, total, devolvidos, pendentes };
      }

      // ============================================
      // CÁLCULO DE PRAZO
      // ============================================
      function calcularPrazoInfo(emp) {
        const hj = new Date(hojeISO());
        const prazoDate = new Date(emp.prazo_devolucao + "T00:00:00");
        const diffDias = Math.floor((prazoDate - hj) / (1000 * 60 * 60 * 24));

        const { tipo, pendentes } = analisarEstado(emp);

        // Se é devolução total, não destaca prazo. Mostra data de devolução final.
        if (tipo === "devolucao") {
          const ultimaDevolucao = (emp.itens || [])
            .filter((i) => i.data_devolucao)
            .sort(
              (a, b) => new Date(b.data_devolucao) - new Date(a.data_devolucao),
            )[0]?.data_devolucao;

          const maiorAtraso = Math.max(
            ...(emp.itens || []).map((i) => i.dias_atraso || 0),
            0,
          );

          return {
            tipo: "devolucao",
            dataDevolucao: ultimaDevolucao,
            maiorAtraso,
          };
        }

        // Empréstimo ou misto com pendentes
        if (pendentes === 0) return { tipo: "sem-pendentes" };

        let classe = "em-dia";
        let rotulo = "Devolver até";
        let detalhe = "";

        if (diffDias < 0) {
          classe = "atrasado";
          rotulo = "Prazo vencido em";
          detalhe = `${-diffDias} dia${-diffDias !== 1 ? "s" : ""} em atraso`;
        } else if (diffDias === 0) {
          classe = "vence-hoje";
          rotulo = "Devolver hoje";
          detalhe = `Vence hoje · ${diaSemana(emp.prazo_devolucao)}`;
        } else {
          classe = "em-dia";
          rotulo = "Devolver até";
          detalhe = `Faltam ${diffDias} dia${diffDias !== 1 ? "s" : ""} · ${diaSemana(emp.prazo_devolucao)}`;
        }

        return {
          tipo: "emprestimo",
          classe,
          rotulo,
          detalhe,
          data: emp.prazo_devolucao,
        };
      }

      // ============================================
      // RENDERIZAÇÃO
      // ============================================
      function renderizarCabecalho(emp, tipoComprovante) {
        const tipoLabel =
          tipoComprovante === "devolucao"
            ? "Comprovante de Devolução"
            : tipoComprovante === "misto"
              ? "Comprovante de Movimentação"
              : "Comprovante de Empréstimo";

        return `
          <div class="cabecalho">
            <div class="brasao">
              <img
                src="../brasao-pref.png"
                alt="Brasão"
                onerror="this.classList.add('is-hidden'); this.nextElementSibling.classList.add('is-visible');"
              />
              <div class="brasao-fallback">PMG</div>
            </div>
            <div class="identificacao">
              <h1>Prefeitura Municipal de Pitangueiras</h1>
              <h2>${escaparHtml(config.nome_biblioteca || "Biblioteca Municipal")}</h2>
              <p>
                Departamento de Cultura · Av. Central, s/n · Pitangueiras · PR
              </p>
              <p>Tel: (43) 0000-0000 · biblioteca@pitangueiras.pr.gov.br</p>
            </div>
            <div class="tipo-comprovante">
              <span class="tipo ${tipoComprovante === "devolucao" ? "devolucao" : "emprestimo"}">
                ${tipoLabel}
              </span>
              <span class="codigo">${escaparHtml(emp.codigo)}</span>
            </div>
          </div>
        `;
      }

      function renderizarDadosLeitor(leitor) {
        const endereco = [
          leitor.endereco,
          leitor.numero,
          leitor.bairro,
          leitor.cidade && leitor.uf
            ? `${leitor.cidade}/${leitor.uf}`
            : leitor.cidade || leitor.uf,
        ]
          .filter(Boolean)
          .join(", ");

        return `
          <div class="secao">
            <div class="secao-titulo">
              <i class="fas fa-user"></i> Dados do leitor
            </div>
            <div class="secao-conteudo">
              <div class="grid-info">
                <div class="info-linha info-linha--span-2">
                  <span class="label">Nome completo</span>
                  <span class="valor">${escaparHtml(leitor.nome || "—")}</span>
                </div>
                <div class="info-linha">
                  <span class="label">Carteirinha</span>
                  <span class="valor mono">${escaparHtml(leitor.codigo_carteirinha || "—")}</span>
                </div>
                <div class="info-linha">
                  <span class="label">CPF</span>
                  <span class="valor mono">${escaparHtml(leitor.cpf || "Não informado")}</span>
                </div>
                <div class="info-linha">
                  <span class="label">Telefone</span>
                  <span class="valor">${escaparHtml(leitor.telefone || "—")}</span>
                </div>
                <div class="info-linha">
                  <span class="label">E-mail</span>
                  <span class="valor">${escaparHtml(leitor.email || "—")}</span>
                </div>
                ${
                  endereco
                    ? `
                  <div class="info-linha info-linha--span-3">
                    <span class="label">Endereço</span>
                    <span class="valor valor--regular">${escaparHtml(endereco)}</span>
                  </div>`
                    : ""
                }
              </div>
            </div>
          </div>
        `;
      }

      function renderizarDadosEmprestimo(emp, atendente, estado) {
        const { tipo, total, devolvidos, pendentes } = estado;

        return `
          <div class="secao">
            <div class="secao-titulo">
              <i class="fas fa-file-contract"></i> Dados do empréstimo
            </div>
            <div class="secao-conteudo">
              <div class="grid-info">
                <div class="info-linha">
                  <span class="label">Código</span>
                  <span class="valor mono">${escaparHtml(emp.codigo)}</span>
                </div>
                <div class="info-linha">
                  <span class="label">Data da retirada</span>
                  <span class="valor">${formatarDataHora(emp.data_retirada)}</span>
                </div>
                <div class="info-linha">
                  <span class="label">Prazo original</span>
                  <span class="valor">${formatarData(emp.prazo_devolucao)}</span>
                </div>
                <div class="info-linha">
                  <span class="label">Atendente</span>
                  <span class="valor">${escaparHtml(atendente?.nome || "—")}</span>
                </div>
                <div class="info-linha">
                  <span class="label">Exemplares</span>
                  <span class="valor">${total} · ${devolvidos} devolvido${devolvidos !== 1 ? "s" : ""} · ${pendentes} pendente${pendentes !== 1 ? "s" : ""}</span>
                </div>
                <div class="info-linha">
                  <span class="label">Renovações</span>
                  <span class="valor">${emp.renovacoes || 0}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderizarPrazo(info) {
        if (info.tipo === "devolucao") {
          return `
            <div class="prazo-destaque">
              <div class="bloco-esq">
                <div class="rotulo rotulo--concluido">Devolução registrada</div>
                <div class="data-grande data-grande--concluido">✓ CONCLUÍDO</div>
                <div class="detalhe">
                  Todos os exemplares foram devolvidos em ${formatarData(info.dataDevolucao)}.
                  ${info.maiorAtraso > 0 ? `<br/><strong class="atraso-destaque">Maior atraso registrado: ${info.maiorAtraso} dia${info.maiorAtraso !== 1 ? "s" : ""}.</strong>` : ""}
                </div>
              </div>
              <div class="bloco-dir">
                <i class="fas fa-circle-check icone icone--suave"></i>
              </div>
            </div>
          `;
        }

        if (info.tipo === "sem-pendentes") {
          return "";
        }

        // Empréstimo em aberto ou misto com pendentes
        return `
          <div class="prazo-destaque ${info.classe}">
            <div class="bloco-esq">
              <div class="rotulo">${escaparHtml(info.rotulo)}</div>
              <div class="data-grande">${formatarData(info.data)}</div>
              <div class="detalhe">${escaparHtml(info.detalhe)}</div>
            </div>
            <div class="bloco-dir">
              <i class="fas fa-calendar-check icone"></i>
            </div>
          </div>
        `;
      }

      function renderizarTabelaExemplares(emp) {
        const itens = emp.itens || [];

        const linhas = itens
          .map((item) => {
            const ex = item.exemplar || {};
            const livro = ex.livro || {};
            const autores = (livro.autores || [])
              .map((a) => a.autor?.nome)
              .filter(Boolean)
              .join(", ");

            const prat = ex.prateleira
              ? `Est. ${ex.prateleira.estante?.codigo || "?"} · Prat. ${ex.prateleira.numero}`
              : "—";

            // Status
            let statusHtml = "";
            if (item.data_devolucao) {
              if (item.dias_atraso > 0) {
                statusHtml = `<span class="status-tag atrasado">Devolvido · ${item.dias_atraso}d atraso</span>`;
              } else {
                statusHtml = `<span class="status-tag devolvido">Devolvido em ${formatarData(item.data_devolucao)}</span>`;
              }
            } else {
              statusHtml = `<span class="status-tag pendente">Em posse do leitor</span>`;
            }

            return `
              <tr>
                <td class="codigo-cell">${escaparHtml(ex.codigo || "—")}</td>
                <td>
                  <div class="titulo-cell">${escaparHtml(livro.titulo || "—")}</div>
                  ${autores ? `<div class="autor-cell">${escaparHtml(autores)}</div>` : ""}
                </td>
                <td class="prat-cell">${escaparHtml(prat)}</td>
                <td class="status-cell">${statusHtml}</td>
              </tr>
            `;
          })
          .join("");

        return `
          <div class="secao">
            <div class="secao-titulo">
              <i class="fas fa-book"></i> Exemplares (${itens.length})
            </div>
            <div class="secao-conteudo secao-conteudo--compacta">
              <table class="tabela-exemplares" aria-label="Tabela de dados">
                <thead>
                  <tr>
                    <th class="coluna-codigo">Código</th>
                    <th>Título / Autor</th>
                    <th class="coluna-localizacao">Localização</th>
                    <th class="coluna-situacao">Situação</th>
                  </tr>
                </thead>
                <tbody>
                  ${linhas}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderizarResumo(estado, info) {
        const { total, devolvidos, pendentes } = estado;

        // Soma de dias de atraso
        const totalAtraso = (emprestimo.itens || []).reduce(
          (acc, i) => acc + (i.dias_atraso || 0),
          0,
        );

        return `
          <div class="resumo-caixa">
            <div class="resumo-item">
              <div class="num">${total}</div>
              <div class="lbl">Total</div>
            </div>
            <div class="resumo-item destaque">
              <div class="num">${devolvidos}</div>
              <div class="lbl">Devolvidos</div>
            </div>
            <div class="resumo-item ${pendentes > 0 ? "" : "destaque"}">
              <div class="num">${pendentes}</div>
              <div class="lbl">Pendentes</div>
            </div>
            <div class="resumo-item ${totalAtraso > 0 ? "atraso" : ""}">
              <div class="num">${totalAtraso}</div>
              <div class="lbl">Dias atraso</div>
            </div>
          </div>
        `;
      }

      function renderizarObservacoes(emp) {
        const obs = emp.observacoes || "";
        return `
          <div class="secao">
            <div class="secao-titulo">
              <i class="fas fa-message"></i> Observações
            </div>
            <div class="secao-conteudo">
              <div class="observacoes-box">${escaparHtml(obs)}</div>
            </div>
          </div>
        `;
      }

      function renderizarAssinaturas(emp, estado) {
        const { pendentes } = estado;
        const leitor = emp.leitor || {};

        return `
          <div class="assinaturas">
            <div class="assinatura-bloco">
              <div class="linha"></div>
              <div class="nome">${escaparHtml(leitor.nome || "—")}</div>
              <div class="cargo">
                Leitor${leitor.codigo_carteirinha ? ` · ${escaparHtml(leitor.codigo_carteirinha)}` : ""}
              </div>
            </div>
            <div class="assinatura-bloco">
              <div class="linha"></div>
              <div class="nome">${escaparHtml(atendente?.nome || "Servidor responsável")}</div>
              <div class="cargo">
                ${escaparHtml(atendente?.cargo || "Biblioteca Municipal")}
              </div>
            </div>
          </div>
        `;
      }

      function renderizarRodape(emp, via) {
        return `
          <div class="rodape">
            <div class="info-geracao">
              Emitido em <strong>${formatarDataHora(new Date().toISOString())}</strong> ·
              Sistema de Gestão da Biblioteca Municipal · Prefeitura de Pitangueiras/PR
            </div>
            <div class="pagina">
              Via: <strong>${escaparHtml(via)}</strong> · Documento gerado eletronicamente
            </div>
          </div>
        `;
      }

      // ============================================
      // COMPOSIÇÃO COMPLETA DE UMA VIA
      // ============================================
      function renderizarVia(viaLabel) {
        const estado = analisarEstado(emprestimo);
        const info = calcularPrazoInfo(emprestimo);
        const tipoComprovante = estado.tipo;

        return `
          <div class="folha">
            <div class="selo-via">${escaparHtml(viaLabel)}</div>

            ${renderizarCabecalho(emprestimo, tipoComprovante)}

            <div class="titulo-doc">
              <h2>${
                tipoComprovante === "devolucao"
                  ? "Comprovante de Devolução"
                  : tipoComprovante === "misto"
                    ? "Comprovante de Movimentação"
                    : "Comprovante de Empréstimo"
              }</h2>
              <p>
                Documento comprobatório da movimentação de exemplares da Biblioteca Municipal
              </p>
            </div>

            ${renderizarDadosEmprestimo(emprestimo, atendente, estado)}
            ${renderizarDadosLeitor(emprestimo.leitor || {})}
            ${renderizarPrazo(info)}
            ${renderizarTabelaExemplares(emprestimo)}
            ${renderizarResumo(estado, info)}
            ${renderizarObservacoes(emprestimo)}
            ${renderizarAssinaturas(emprestimo, estado)}
            ${renderizarRodape(emprestimo, viaLabel)}
          </div>
        `;
      }

      function renderizarVias() {
        const container = document.getElementById("containerVias");

        if (totalVias === 1) {
          container.innerHTML = renderizarVia("Via única");
        } else {
          container.innerHTML =
            renderizarVia("Via do leitor") + renderizarVia("Via da biblioteca");
        }
      }

      // ============================================
      // ERRO
      // ============================================
      function mostrarErro(mensagem, titulo = "Não foi possível carregar") {
        document.getElementById("estadoCarregando").style.display = "none";
        document.getElementById("barraAcoes").style.display = "none";
        document.getElementById("estadoErro").style.display = "block";
        document.getElementById("tituloErro").textContent = titulo;
        document.getElementById("mensagemErro").textContent = mensagem;
      }

      // ============================================
      // INICIALIZAÇÃO
      // ============================================
      async function init() {
        try {
          // Sessão
          const {
            data: { session },
          } = await supabase.auth.getSession();
          if (!session) {
            window.location.href = "../intranet.html";
            return;
          }

          // ID da URL
          const params = new URLSearchParams(window.location.search);
          const idParam = params.get("id");
          if (!idParam) {
            mostrarErro(
              "Parâmetro ?id= não informado na URL. Este comprovante precisa ser aberto a partir do módulo de Empréstimos ou Devoluções.",
              "Parâmetro ausente",
            );
            return;
          }

          // Carrega dados
          await carregarConfiguracoes();
          emprestimo = await carregarEmprestimo(idParam);
          atendente = emprestimo.usuario || null;

          // Mostra barra de ações
          document.getElementById("estadoCarregando").style.display = "none";
          document.getElementById("barraAcoes").style.display = "flex";

          const estado = analisarEstado(emprestimo);
          const tipoLabel =
            estado.tipo === "devolucao"
              ? "Devolução"
              : estado.tipo === "misto"
                ? "Movimentação"
                : "Empréstimo";
          document.getElementById("infoArquivo").innerHTML =
            `<strong>${escaparHtml(emprestimo.codigo)}</strong> · ${tipoLabel} · ${escaparHtml(emprestimo.leitor?.nome || "")}`;

          // Renderiza as vias
          renderizarVias();

          // Atualiza título da aba
          document.title = `${emprestimo.codigo} · Comprovante · Biblioteca`;
        } catch (err) {
          console.error(err);
          mostrarErro(
            err.message || "Erro inesperado ao carregar o comprovante.",
          );
        }
      }

      // ============================================
      // EVENTOS DOS BOTÕES
      // ============================================
      document.getElementById("btnImprimir").addEventListener("click", () => {
        window.print();
      });

      document.getElementById("btnVoltar").addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "emprestimos.html";
        }
      });

      document.getElementById("btnToggleVias").addEventListener("click", () => {
        totalVias = totalVias === 2 ? 1 : 2;
        document.getElementById("txtToggleVias").textContent =
          totalVias === 2 ? "2 vias" : "1 via";
        renderizarVias();
      });

      // Ctrl+P abre o print (comportamento nativo já faz isso, mas garante)
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "p") {
          e.preventDefault();
          window.print();
        }
      });

      // ============================================
      // START
      // ============================================
      init();
    </script>
      <script type="module" src="./biblioteca-saas.js"></script>
  </body>
</html>
