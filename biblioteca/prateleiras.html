<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=20261009-brasao-2">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=20261009-brasao-2">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png?v=20261009-brasao-2">
    <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico?v=20261009-brasao-2">





    <title>Biblioteca Municipal · Prateleiras</title>

    <!-- Font Awesome 6 -->








<script src="../shared/js/acessibilidade-intranet.js" defer></script>
  <link rel="stylesheet" href="../shared/css/vendor-fontawesome/all.min.css?v=20261009-fontawesome-woff2-only-1">
  <link rel="stylesheet" href="../shared/css/intranet-global.css?v=20261010-shared-shell-theme-4">
  <link rel="stylesheet" href="../controle-de-saldos/css/atas-saldos-pedidos-redesign.css?v=20261010-shared-shell-theme-5">
</head>
  <body data-intranet-module="biblioteca" data-intranet-theme="atas" data-intranet-page="biblioteca-prateleiras">
    <!-- LOADING -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>

    <!-- LAYOUT -->
    <div class="app-layout" id="mainSystem">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar"></aside>

      <!-- MAIN -->
      <div class="main-area">
        <!-- TOPBAR -->
        <header class="topbar" id="topbar"></header>

        <!-- CONTEÚDO -->
        <main class="conteudo conteudo-full">
          <div class="layout-duas-colunas">
            <!-- ============================================================
                 COLUNA ESQUERDA · ESTANTES
                 ============================================================ -->
            <div class="coluna">
              <div class="coluna-header">
                <h3>
                  <i class="fas fa-warehouse"></i> Estantes
                  <span

                    id="contadorEstantes"
                     class="intranet-style-bbc9e3c6ce">0</span
                  >
                </h3>
                <button
                  class="btn-icon-add"
                  id="btnNovaEstante"
                  title="Nova estante"
                 type="button">
                  <i class="fas fa-plus"></i>
                </button>
              </div>

              <div class="coluna-corpo" id="listaEstantes">
                <div class="estado-vazio">
                  <i class="fas fa-spinner fa-spin"></i>
                  Carregando estantes...
                </div>
              </div>
            </div>

            <!-- ============================================================
                 COLUNA DIREITA · PRATELEIRAS DA ESTANTE SELECIONADA
                 ============================================================ -->
            <div class="coluna">
              <div id="painelPrateleiras">
                <!-- Estado inicial: nenhuma estante selecionada -->
                <div class="coluna-header">
                  <h3><i class="fas fa-bars-staggered"></i> Prateleiras</h3>
                </div>
                <div class="coluna-corpo">
                  <div class="estado-vazio">
                    <i class="fas fa-hand-pointer"></i>
                    Selecione uma estante à esquerda para ver e gerenciar suas
                    prateleiras.
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- NOTIFICAÇÕES -->
    <div class="notification-center" id="notificationCenter"></div>

    <!-- ============================================================
         MODAL DE ESTANTE
         ============================================================ -->
    <div class="modal-overlay intranet-style-03f972b1e1" id="modalEstante">
      <div class="modal">
        <div class="modal-header">
          <h3>
            <i class="fas fa-warehouse"></i>
            <span id="modalEstanteTitulo">Nova estante</span>
          </h3>
          <button class="btn-fechar" id="btnFecharModalEstante" title="Fechar" type="button">
            <i class="fas fa-xmark"></i>
          </button>
        </div>

        <form id="formEstante">
          <div class="modal-body">
            <input type="hidden" id="estanteId" />

            <div class="form-grid">
              <div class="form-group">
                <label class="form-label" for="estanteCodigo">
                  Código <span class="required">*</span>
                </label>
                <input
                  type="text"
                  id="estanteCodigo"
                  class="form-input intranet-style-f3775769ea"
                  placeholder="Ex: A, B, INFANTIL"
                  required
                  maxlength="20"

                / aria-label="Ex: A, B, INFANTIL">
                <span class="form-hint">Identificador curto e único.</span>
              </div>

              <div class="form-group">
                <label class="form-label" for="estanteSetor">Setor</label>
                <input
                  type="text"
                  id="estanteSetor"
                  class="form-input"
                  placeholder="Ex: Acervo Geral, Infantil"
                  maxlength="100"
                / aria-label="Ex: Acervo Geral, Infantil">
              </div>

              <div class="form-group full">
                <label class="form-label" for="estanteDescricao"
                  >Descrição</label
                >
                <textarea
                  id="estanteDescricao"
                  class="form-textarea"
                  placeholder="Descrição ou observações sobre esta estante..."
                 aria-label="Descrição ou observações sobre esta estante..."></textarea>
              </div>

              <div class="form-group full">
                <label class="form-label" for="estanteAtivo">Status</label>
                <select id="estanteAtivo" class="form-select" aria-label="estanteAtivo">
                  <option value="true">Ativa</option>
                  <option value="false">Inativa</option>
                </select>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              id="btnCancelarEstante"
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary" id="btnSalvarEstante">
              <i class="fas fa-save"></i> Salvar estante
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ============================================================
         MODAL DE PRATELEIRA
         ============================================================ -->
    <div class="modal-overlay intranet-style-03f972b1e1" id="modalPrateleira">
      <div class="modal">
        <div class="modal-header">
          <h3>
            <i class="fas fa-bars-staggered"></i>
            <span id="modalPrateleiraTitulo">Nova prateleira</span>
          </h3>
          <button
            class="btn-fechar"
            id="btnFecharModalPrateleira"
            title="Fechar"
           type="button">
            <i class="fas fa-xmark"></i>
          </button>
        </div>

        <form id="formPrateleira">
          <div class="modal-body">
            <input type="hidden" id="prateleiraId" />
            <input type="hidden" id="prateleiraEstanteId" />

            <div

             class="intranet-style-42686a626c">
              <i class="fas fa-warehouse intranet-style-0297c7343c"></i>
              <span class="intranet-style-bc830a0892">
                Estante:
                <strong id="prateleiraEstanteNome">—</strong>
              </span>
            </div>

            <div class="form-grid">
              <div class="form-group full">
                <label class="form-label" for="prateleiraNumero">
                  Número <span class="required">*</span>
                </label>
                <input
                  type="text"
                  id="prateleiraNumero"
                  class="form-input"
                  placeholder="Ex: 01, 02, 03"
                  required
                  maxlength="20"
                / aria-label="Ex: 01, 02, 03">
                <span class="form-hint">
                  Deve ser único dentro desta estante.
                </span>
              </div>

              <div class="form-group">
                <label class="form-label" for="prateleiraPosInicial">
                  Posição inicial
                </label>
                <input
                  type="text"
                  id="prateleiraPosInicial"
                  class="form-input"
                  placeholder="Ex: 0001"
                  maxlength="20"
                / aria-label="Ex: 0001">
              </div>

              <div class="form-group">
                <label class="form-label" for="prateleiraPosFinal">
                  Posição final
                </label>
                <input
                  type="text"
                  id="prateleiraPosFinal"
                  class="form-input"
                  placeholder="Ex: 0050"
                  maxlength="20"
                / aria-label="Ex: 0050">
              </div>

              <div class="form-group full">
                <label class="form-label" for="prateleiraObservacoes">
                  Observações
                </label>
                <textarea
                  id="prateleiraObservacoes"
                  class="form-textarea"
                  placeholder="Observações sobre esta prateleira..."
                 aria-label="Observações sobre esta prateleira..."></textarea>
              </div>

              <div class="form-group full">
                <label class="form-label" for="prateleiraAtivo">Status</label>
                <select id="prateleiraAtivo" class="form-select" aria-label="prateleiraAtivo">
                  <option value="true">Ativa</option>
                  <option value="false">Inativa</option>
                </select>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              id="btnCancelarPrateleira"
            >
              Cancelar
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              id="btnSalvarPrateleira"
            >
              <i class="fas fa-save"></i> Salvar prateleira
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- SUPABASE SDK -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <script type="module">
import { supabase } from "../shared/js/supabase.js";
      import { initBibliotecaLayout } from "./biblioteca-layout.js?v=20261010-biblioteca-shared-shell-2";
      await initBibliotecaLayout(supabase);
      // ============================================
      // CONFIGURAÇÃO SUPABASE
      // ============================================
      // ============================================
      // ESTADO
      // ============================================
      let usuarioLogado = null;
      let estantesCarregadas = [];
      let prateleirasCarregadas = [];
      let estanteSelecionadaId = null;

      // ============================================
      // NOTIFICAÇÕES
      // ============================================
      window.showNotification = function (
        type,
        title,
        message,
        duration = 4000,
      ) {
        const container = document.getElementById("notificationCenter");
        if (!container) return;
        const icons = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
        const toast = document.createElement("div");
        toast.className = `notification-toast notification-${type}`;
        toast.innerHTML = `
          <span class="notification-icon">${icons[type]}</span>
          <div class="notification-content">
            <div class="notification-title">${title}</div>
            <div class="notification-message">${message}</div>
          </div>
          <button class="notification-close" type="button">✕</button>
        `;
        container.appendChild(toast);
        toast
          .querySelector(".notification-close")
          .addEventListener("click", () => {
            toast.classList.add("removing");
            setTimeout(() => toast.remove(), 300);
          });
        if (duration > 0) {
          setTimeout(() => {
            if (toast.parentElement) {
              toast.classList.add("removing");
              setTimeout(() => toast.remove(), 300);
            }
          }, duration);
        }
        return toast;
      };

      window.showConfirm = function (title, message, onConfirm) {
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="modal" data-intranet-inline-style="isc62d458ae919">
            <div class="modal-body" data-intranet-inline-style="isbf1491c3d36c">
              <div data-intranet-inline-style="isafb603b9cffe">❓</div>
              <h3 data-intranet-inline-style="iscd0d30d04a11">${title}</h3>
              <p data-intranet-inline-style="is27dd4ab97eb6">${message}</p>
              <div data-intranet-inline-style="isb8dc4ca85911">
                <button class="btn btn-secondary" id="cancelBtn" type="button">Cancelar</button>
                <button class="btn btn-danger" id="confirmBtn" type="button">Confirmar</button>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        const close = () => {
          overlay.style.opacity = "0";
          setTimeout(() => overlay.remove(), 200);
        };
        overlay.querySelector("#cancelBtn").addEventListener("click", close);
        overlay.querySelector("#confirmBtn").addEventListener("click", () => {
          close();
          if (typeof onConfirm === "function") onConfirm();
        });
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) close();
        });
        return overlay;
      };

      // ============================================
      // HELPERS
      // ============================================
      function escaparHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function iniciais(nome) {
        if (!nome) return "?";
        const p = nome.trim().split(/\s+/);
        if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
        return (p[0][0] + p[p.length - 1][0]).toUpperCase();
      }

      function setTexto(id, valor) {
        const el = document.getElementById(id);
        if (el) el.textContent = valor;
      }

      function esconderLoading() {
        document.getElementById("loadingOverlay")?.classList.add("hidden");
      }

      // ============================================
      // SESSÃO
      // ============================================
      async function verificarSessao() {
        const {
          data: { session },
        } = await supabase.auth.getSession();
        if (!session) {
          window.location.href = "../intranet.html";
          return null;
        }

        const { data: perfil, error } = await supabase
          .from("usuarios")
          .select("id, uuid, nome, email, perfil, ativo")
          .eq("uuid", session.user.id)
          .maybeSingle();

        if (error || !perfil || perfil.ativo === false) {
          window.location.href = "../intranet.html";
          return null;
        }

        usuarioLogado = perfil;
        return perfil;
      }

      function renderizarUsuario() {
        if (!usuarioLogado) return;
        setTexto("topbarNome", usuarioLogado.nome || "—");
        setTexto(
          "topbarData",
          new Date().toLocaleDateString("pt-BR", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          }),
        );
        const el = document.getElementById("avatarIniciais");
        if (el) el.textContent = iniciais(usuarioLogado.nome);

        // Preenche o dropdown do avatar
        setTexto("menuNome", usuarioLogado.nome || "—");
        setTexto("menuEmail", usuarioLogado.email || "—");
      }

      // ============================================
      // MENU DO AVATAR (dropdown)
      // ============================================
      

      // ============================================
      // CARREGAR ESTANTES (com contagem de prateleiras)
      // ============================================
      async function carregarEstantes() {
        const { data, error } = await supabase
          .from("bib_estantes")
          .select(
            `
            id, codigo, descricao, setor, ativo, created_at,
            prateleiras: bib_prateleiras ( id )
          `,
          )
          .order("codigo", { ascending: true });

        if (error) {
          console.error("Erro ao carregar estantes:", error);
          document.getElementById("listaEstantes").innerHTML = `
            <div class="estado-vazio">
              <i class="fas fa-circle-exclamation"></i>
              Erro ao carregar estantes.<br/>
              <small>${escaparHtml(error.message)}</small>
            </div>`;
          return;
        }

        estantesCarregadas = data || [];
        renderizarEstantes();
      }

      function renderizarEstantes() {
        const container = document.getElementById("listaEstantes");
        const contador = document.getElementById("contadorEstantes");
        if (contador) contador.textContent = estantesCarregadas.length;

        if (estantesCarregadas.length === 0) {
          container.innerHTML = `
            <div class="estado-vazio">
              <i class="fas fa-warehouse"></i>
              Nenhuma estante cadastrada ainda.
              <button class="btn btn-primary" id="btnCriarPrimeiraEstante" data-intranet-inline-style="isb0fa078e6d28" type="button">
                <i class="fas fa-plus"></i> Criar primeira estante
              </button>
            </div>`;
          const btn = document.getElementById("btnCriarPrimeiraEstante");
          if (btn) btn.addEventListener("click", abrirModalNovaEstante);
          return;
        }

        container.innerHTML = estantesCarregadas
          .map((e) => {
            const numPrat = (e.prateleiras || []).length;
            const selecionada = e.id === estanteSelecionadaId;
            const meta = [
              e.setor ? escaparHtml(e.setor) : null,
              `${numPrat} prateleira${numPrat === 1 ? "" : "s"}`,
            ]
              .filter(Boolean)
              .join(" · ");

            return `
              <div class="item-lista ${selecionada ? "selecionado" : ""}" data-id="${e.id}">
                <div class="item-avatar">${escaparHtml(e.codigo)}</div>
                <div class="item-info">
                  <strong>Estante ${escaparHtml(e.codigo)}</strong>
                  <span>${meta || "Sem informações"}</span>
                </div>
                <span class="badge-contagem">${numPrat}</span>
                <div class="item-acoes">
                  <button class="btn-acao-mini editar" data-acao="editar" data-id="${e.id}" title="Editar" type="button">
                    <i class="fas fa-pen"></i>
                  </button>
                  <button class="btn-acao-mini excluir" data-acao="excluir" data-id="${e.id}" title="Excluir" type="button">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>`;
          })
          .join("");

        // Eventos
        container.querySelectorAll(".item-lista").forEach((el) => {
          el.addEventListener("click", (ev) => {
            // Ignora cliques nos botões de ação
            if (ev.target.closest("[data-acao]")) return;
            selecionarEstante(parseInt(el.dataset.id));
          });
        });
        container.querySelectorAll("[data-acao='editar']").forEach((btn) => {
          btn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            abrirModalEditarEstante(parseInt(btn.dataset.id));
          });
        });
        container.querySelectorAll("[data-acao='excluir']").forEach((btn) => {
          btn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            confirmarExclusaoEstante(parseInt(btn.dataset.id));
          });
        });
      }

      // ============================================
      // SELECIONAR ESTANTE
      // ============================================
      async function selecionarEstante(id) {
        estanteSelecionadaId = id;
        renderizarEstantes();
        await carregarPrateleirasDaEstante(id);
      }

      // ============================================
      // CARREGAR PRATELEIRAS DA ESTANTE SELECIONADA
      // ============================================
      async function carregarPrateleirasDaEstante(estanteId) {
        const painel = document.getElementById("painelPrateleiras");
        const estante = estantesCarregadas.find((e) => e.id === estanteId);
        if (!estante) {
          painel.innerHTML = `
            <div class="coluna-header">
              <h3><i class="fas fa-bars-staggered"></i> Prateleiras</h3>
            </div>
            <div class="coluna-corpo">
              <div class="estado-vazio">
                <i class="fas fa-hand-pointer"></i>
                Selecione uma estante à esquerda.
              </div>
            </div>`;
          return;
        }

        // Esqueleto com header + estante selecionada
        painel.innerHTML = `
          <div class="estante-selecionada-info">
            <div class="estante-selecionada-avatar">${escaparHtml(estante.codigo)}</div>
            <div class="estante-selecionada-meta">
              <h4>Estante ${escaparHtml(estante.codigo)}</h4>
              <span>${escaparHtml(estante.setor || "Sem setor definido")}${
                estante.descricao ? " · " + escaparHtml(estante.descricao) : ""
              }</span>
            </div>
            <button class="btn btn-primary" id="btnNovaPrateleira" data-intranet-inline-style="iscd3cce96528b" type="button">
              <i class="fas fa-plus"></i> Nova prateleira
            </button>
          </div>

          <div class="coluna-header">
            <h3>
              <i class="fas fa-bars-staggered"></i> Prateleiras
              <span
                data-intranet-inline-style="is5b7e474de34d"
                id="contadorPrateleiras">0</span>
            </h3>
          </div>

          <div class="coluna-corpo" id="listaPrateleiras">
            <div class="estado-vazio">
              <i class="fas fa-spinner fa-spin"></i>
              Carregando prateleiras...
            </div>
          </div>
        `;

        document
          .getElementById("btnNovaPrateleira")
          .addEventListener("click", abrirModalNovaPrateleira);

        // Consulta com contagem de exemplares
        const { data, error } = await supabase
          .from("bib_prateleiras")
          .select(
            `
            id, numero, posicao_inicial, posicao_final, observacoes, ativo, created_at,
            exemplares: bib_exemplares ( id )
          `,
          )
          .eq("estante_id", estanteId)
          .order("numero", { ascending: true });

        if (error) {
          console.error("Erro ao carregar prateleiras:", error);
          document.getElementById("listaPrateleiras").innerHTML = `
            <div class="estado-vazio">
              <i class="fas fa-circle-exclamation"></i>
              Erro ao carregar prateleiras.<br/>
              <small>${escaparHtml(error.message)}</small>
            </div>`;
          return;
        }

        prateleirasCarregadas = data || [];
        renderizarPrateleiras();
      }

      function renderizarPrateleiras() {
        const container = document.getElementById("listaPrateleiras");
        const contador = document.getElementById("contadorPrateleiras");
        if (contador) contador.textContent = prateleirasCarregadas.length;

        if (prateleirasCarregadas.length === 0) {
          container.innerHTML = `
            <div class="estado-vazio">
              <i class="fas fa-bars-staggered"></i>
              Esta estante ainda não possui prateleiras.<br/>
              Clique em <strong>Nova prateleira</strong> para começar.
            </div>`;
          return;
        }

        container.innerHTML = prateleirasCarregadas
          .map((p) => {
            const numEx = (p.exemplares || []).length;
            const posInfo = [
              p.posicao_inicial ? `de ${p.posicao_inicial}` : null,
              p.posicao_final ? `até ${p.posicao_final}` : null,
            ]
              .filter(Boolean)
              .join(" ");

            return `
              <div class="item-lista" data-id="${p.id}" data-intranet-inline-style="isa8dd1de854f7">
                <div class="item-avatar"><i class="fas fa-bars-staggered" data-intranet-inline-style="is0e557416116d"></i></div>
                <div class="item-info">
                  <strong>Prateleira ${escaparHtml(p.numero)}</strong>
                  <span>
                    ${posInfo || "Sem faixa de posições definida"}
                    · ${numEx} exemplar${numEx === 1 ? "" : "es"}
                  </span>
                </div>
                <span class="badge-contagem">${numEx}</span>
                <div class="item-acoes">
                  <button class="btn-acao-mini editar" data-acao="editar-prat" data-id="${p.id}" title="Editar" type="button">
                    <i class="fas fa-pen"></i>
                  </button>
                  <button class="btn-acao-mini excluir" data-acao="excluir-prat" data-id="${p.id}" title="Excluir" type="button">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>`;
          })
          .join("");

        container
          .querySelectorAll("[data-acao='editar-prat']")
          .forEach((btn) => {
            btn.addEventListener("click", () =>
              abrirModalEditarPrateleira(parseInt(btn.dataset.id)),
            );
          });
        container
          .querySelectorAll("[data-acao='excluir-prat']")
          .forEach((btn) => {
            btn.addEventListener("click", () =>
              confirmarExclusaoPrateleira(parseInt(btn.dataset.id)),
            );
          });
      }

      // ============================================
      // MODAL ESTANTE · NOVA
      // ============================================
      function limparFormEstante() {
        document.getElementById("formEstante").reset();
        document.getElementById("estanteId").value = "";
        document.getElementById("estanteAtivo").value = "true";
      }

      function abrirModalNovaEstante() {
        limparFormEstante();
        document.getElementById("modalEstanteTitulo").textContent =
          "Nova estante";
        document.getElementById("modalEstante").style.display = "flex";
        setTimeout(() => document.getElementById("estanteCodigo").focus(), 100);
      }

      function abrirModalEditarEstante(id) {
        const e = estantesCarregadas.find((x) => x.id === id);
        if (!e) return;
        limparFormEstante();
        document.getElementById("modalEstanteTitulo").textContent =
          "Editar estante";
        document.getElementById("estanteId").value = e.id;
        document.getElementById("estanteCodigo").value = e.codigo || "";
        document.getElementById("estanteSetor").value = e.setor || "";
        document.getElementById("estanteDescricao").value = e.descricao || "";
        document.getElementById("estanteAtivo").value = e.ativo
          ? "true"
          : "false";
        document.getElementById("modalEstante").style.display = "flex";
      }

      function fecharModalEstante() {
        document.getElementById("modalEstante").style.display = "none";
      }

      // ============================================
      // MODAL PRATELEIRA · NOVA
      // ============================================
      function limparFormPrateleira() {
        document.getElementById("formPrateleira").reset();
        document.getElementById("prateleiraId").value = "";
        document.getElementById("prateleiraAtivo").value = "true";
      }

      function abrirModalNovaPrateleira() {
        if (!estanteSelecionadaId) return;
        const estante = estantesCarregadas.find(
          (e) => e.id === estanteSelecionadaId,
        );
        if (!estante) return;

        limparFormPrateleira();
        document.getElementById("modalPrateleiraTitulo").textContent =
          "Nova prateleira";
        document.getElementById("prateleiraEstanteId").value = estante.id;
        document.getElementById("prateleiraEstanteNome").textContent =
          `Estante ${estante.codigo}`;
        document.getElementById("modalPrateleira").style.display = "flex";
        setTimeout(
          () => document.getElementById("prateleiraNumero").focus(),
          100,
        );
      }

      function abrirModalEditarPrateleira(id) {
        const p = prateleirasCarregadas.find((x) => x.id === id);
        if (!p) return;
        const estante = estantesCarregadas.find(
          (e) => e.id === estanteSelecionadaId,
        );

        limparFormPrateleira();
        document.getElementById("modalPrateleiraTitulo").textContent =
          "Editar prateleira";
        document.getElementById("prateleiraId").value = p.id;
        document.getElementById("prateleiraEstanteId").value =
          estanteSelecionadaId;
        document.getElementById("prateleiraEstanteNome").textContent =
          `Estante ${estante?.codigo || "?"}`;
        document.getElementById("prateleiraNumero").value = p.numero || "";
        document.getElementById("prateleiraPosInicial").value =
          p.posicao_inicial || "";
        document.getElementById("prateleiraPosFinal").value =
          p.posicao_final || "";
        document.getElementById("prateleiraObservacoes").value =
          p.observacoes || "";
        document.getElementById("prateleiraAtivo").value = p.ativo
          ? "true"
          : "false";
        document.getElementById("modalPrateleira").style.display = "flex";
      }

      function fecharModalPrateleira() {
        document.getElementById("modalPrateleira").style.display = "none";
      }

      // ============================================
      // SALVAR ESTANTE
      // ============================================
      document
        .getElementById("formEstante")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const btn = document.getElementById("btnSalvarEstante");
          const id = document.getElementById("estanteId").value;
          const codigo = document
            .getElementById("estanteCodigo")
            .value.trim()
            .toUpperCase();

          if (!codigo) {
            window.showNotification(
              "warning",
              "Campo obrigatório",
              "Informe o código da estante.",
            );
            return;
          }

          btn.disabled = true;
          btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Salvando...`;

          try {
            const dados = {
              codigo,
              setor:
                document.getElementById("estanteSetor").value.trim() || null,
              descricao:
                document.getElementById("estanteDescricao").value.trim() ||
                null,
              ativo: document.getElementById("estanteAtivo").value === "true",
            };

            if (id) {
              const { error } = await supabase
                .from("bib_estantes")
                .update(dados)
                .eq("id", parseInt(id));
              if (error) throw error;

              window.showNotification(
                "success",
                "Estante atualizada",
                `Estante ${codigo} foi atualizada.`,
              );
            } else {
              const { error } = await supabase
                .from("bib_estantes")
                .insert(dados);
              if (error) throw error;

              window.showNotification(
                "success",
                "Estante cadastrada",
                `Estante ${codigo} foi adicionada.`,
              );
            }

            fecharModalEstante();
            await carregarEstantes();
            // Se editamos a estante atualmente selecionada, atualiza as prateleiras
            if (estanteSelecionadaId) {
              await carregarPrateleirasDaEstante(estanteSelecionadaId);
            }
          } catch (err) {
            console.error(err);
            if (err.code === "23505" || /duplicate key/i.test(err.message)) {
              window.showNotification(
                "error",
                "Código já existe",
                "Já existe uma estante com este código. Escolha outro.",
              );
            } else {
              window.showNotification(
                "error",
                "Erro ao salvar",
                err.message || "Não foi possível salvar a estante.",
              );
            }
          } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-save"></i> Salvar estante`;
          }
        });

      // ============================================
      // SALVAR PRATELEIRA
      // ============================================
      document
        .getElementById("formPrateleira")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const btn = document.getElementById("btnSalvarPrateleira");
          const id = document.getElementById("prateleiraId").value;
          const estanteId = document.getElementById(
            "prateleiraEstanteId",
          ).value;
          const numero = document
            .getElementById("prateleiraNumero")
            .value.trim();

          if (!numero) {
            window.showNotification(
              "warning",
              "Campo obrigatório",
              "Informe o número da prateleira.",
            );
            return;
          }

          if (!estanteId) {
            window.showNotification(
              "error",
              "Estante não definida",
              "Selecione uma estante antes de salvar.",
            );
            return;
          }

          btn.disabled = true;
          btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Salvando...`;

          try {
            const dados = {
              estante_id: parseInt(estanteId),
              numero,
              posicao_inicial:
                document.getElementById("prateleiraPosInicial").value.trim() ||
                null,
              posicao_final:
                document.getElementById("prateleiraPosFinal").value.trim() ||
                null,
              observacoes:
                document.getElementById("prateleiraObservacoes").value.trim() ||
                null,
              ativo:
                document.getElementById("prateleiraAtivo").value === "true",
            };

            if (id) {
              const { error } = await supabase
                .from("bib_prateleiras")
                .update(dados)
                .eq("id", parseInt(id));
              if (error) throw error;

              window.showNotification(
                "success",
                "Prateleira atualizada",
                `Prateleira ${numero} foi atualizada.`,
              );
            } else {
              const { error } = await supabase
                .from("bib_prateleiras")
                .insert(dados);
              if (error) throw error;

              window.showNotification(
                "success",
                "Prateleira cadastrada",
                `Prateleira ${numero} foi adicionada.`,
              );
            }

            fecharModalPrateleira();
            await carregarEstantes(); // atualiza contadores das estantes
            await carregarPrateleirasDaEstante(parseInt(estanteId));
          } catch (err) {
            console.error(err);
            if (err.code === "23505" || /duplicate key/i.test(err.message)) {
              window.showNotification(
                "error",
                "Número já existe",
                "Já existe uma prateleira com este número nesta estante.",
              );
            } else {
              window.showNotification(
                "error",
                "Erro ao salvar",
                err.message || "Não foi possível salvar a prateleira.",
              );
            }
          } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-save"></i> Salvar prateleira`;
          }
        });

      // ============================================
      // EXCLUIR ESTANTE
      // ============================================
      async function confirmarExclusaoEstante(id) {
        const e = estantesCarregadas.find((x) => x.id === id);
        if (!e) return;

        const numPrat = (e.prateleiras || []).length;
        if (numPrat > 0) {
          window.showNotification(
            "error",
            "Não é possível excluir",
            `Esta estante possui ${numPrat} prateleira(s) cadastrada(s). Exclua-as antes.`,
            6000,
          );
          return;
        }

        window.showConfirm(
          "Excluir estante",
          `Deseja realmente excluir a Estante ${escaparHtml(e.codigo)}? Esta ação não pode ser desfeita.`,
          async () => {
            try {
              const { error } = await supabase
                .from("bib_estantes")
                .delete()
                .eq("id", id);
              if (error) throw error;

              window.showNotification(
                "success",
                "Estante excluída",
                `Estante ${e.codigo} foi removida.`,
              );

              // Se era a estante selecionada, limpa a seleção
              if (estanteSelecionadaId === id) {
                estanteSelecionadaId = null;
                document.getElementById("painelPrateleiras").innerHTML = `
                  <div class="coluna-header">
                    <h3><i class="fas fa-bars-staggered"></i> Prateleiras</h3>
                  </div>
                  <div class="coluna-corpo">
                    <div class="estado-vazio">
                      <i class="fas fa-hand-pointer"></i>
                      Selecione uma estante à esquerda.
                    </div>
                  </div>`;
              }

              await carregarEstantes();
            } catch (err) {
              console.error(err);
              window.showNotification(
                "error",
                "Erro ao excluir",
                err.message || "Não foi possível excluir a estante.",
              );
            }
          },
        );
      }

      // ============================================
      // EXCLUIR PRATELEIRA
      // ============================================
      async function confirmarExclusaoPrateleira(id) {
        const p = prateleirasCarregadas.find((x) => x.id === id);
        if (!p) return;

        const numEx = (p.exemplares || []).length;
        if (numEx > 0) {
          window.showNotification(
            "error",
            "Não é possível excluir",
            `Esta prateleira possui ${numEx} exemplar(es) vinculado(s). Mova-os ou exclua-os antes.`,
            6000,
          );
          return;
        }

        window.showConfirm(
          "Excluir prateleira",
          `Deseja realmente excluir a Prateleira ${escaparHtml(p.numero)}? Esta ação não pode ser desfeita.`,
          async () => {
            try {
              const { error } = await supabase
                .from("bib_prateleiras")
                .delete()
                .eq("id", id);
              if (error) throw error;

              window.showNotification(
                "success",
                "Prateleira excluída",
                `Prateleira ${p.numero} foi removida.`,
              );

              await carregarEstantes();
              await carregarPrateleirasDaEstante(estanteSelecionadaId);
            } catch (err) {
              console.error(err);
              window.showNotification(
                "error",
                "Erro ao excluir",
                err.message || "Não foi possível excluir a prateleira.",
              );
            }
          },
        );
      }

      // ============================================
      // EVENTOS
      // ============================================
      document
        .getElementById("btnNovaEstante")
        .addEventListener("click", abrirModalNovaEstante);
      document
        .getElementById("btnFecharModalEstante")
        .addEventListener("click", fecharModalEstante);
      document
        .getElementById("btnCancelarEstante")
        .addEventListener("click", fecharModalEstante);
      document.getElementById("modalEstante").addEventListener("click", (e) => {
        if (e.target.id === "modalEstante") fecharModalEstante();
      });

      document
        .getElementById("btnFecharModalPrateleira")
        .addEventListener("click", fecharModalPrateleira);
      document
        .getElementById("btnCancelarPrateleira")
        .addEventListener("click", fecharModalPrateleira);
      document
        .getElementById("modalPrateleira")
        .addEventListener("click", (e) => {
          if (e.target.id === "modalPrateleira") fecharModalPrateleira();
        });

      // Toggle sidebar mobile

      // ESC fecha modais
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          fecharModalEstante();
          fecharModalPrateleira();
        }
      });

      // ============================================
      // INICIALIZAÇÃO
      // ============================================
      async function init() {
        try {
          const usuario = await verificarSessao();
          if (!usuario) return;

          renderizarUsuario();
await carregarEstantes();

          // Auto-seleciona a primeira estante, se houver
          if (estantesCarregadas.length > 0) {
            await selecionarEstante(estantesCarregadas[0].id);
          }
        } catch (err) {
          console.error("Erro na inicialização:", err);
          window.showNotification(
            "error",
            "Erro inesperado",
            "Não foi possível inicializar a página.",
          );
        } finally {
          esconderLoading();
        }
      }

      init();
    </script>
      
  </body>
</html>
