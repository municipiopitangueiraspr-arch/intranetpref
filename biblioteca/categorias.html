    <title>Biblioteca Municipal · Categorias</title>

    <!-- Font Awesome 6 -->








<script src="../shared/js/acessibilidade-intranet.js" defer></script>
  
  <link rel="stylesheet" href="../shared/css/vendor-fontawesome/all.min.css?v=20261016-library-identity-1">
  <link rel="stylesheet" href="../shared/css/intranet-identidade.css?v=20261018-library-identity-3">
  <link rel="stylesheet" href="./biblioteca.css?v=20261018-biblioteca-municipio-unico-1">
</head>
  <body data-intranet-module="biblioteca" data-intranet-theme="shared" data-intranet-page="biblioteca-categorias" class="app-shell" data-sidebar-open="false" data-shell-root="../" data-shell-supabase="../shared/js/supabase.js">
    <!-- LOADING -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>

    <!-- LAYOUT -->
    <div class="app-layout" id="mainSystem">
      <!-- SIDEBAR -->
      <aside class="app-sidebar sidebar" id="sidebar"></aside>

      <!-- MAIN -->
      <div class="main-area app-main">
        <!-- TOPBAR -->
        <header class="topbar" id="topbar"></header>

        <!-- CONTEÚDO -->
        <main class="conteudo conteudo-full">
          <!-- BARRA DE AÇÕES -->
          <div class="barra-acoes">
            <div class="campo-busca">
              <i class="fas fa-magnifying-glass"></i>
              <input
                type="text"
                id="inputBusca"
                placeholder="Buscar por nome da categoria..."
              / aria-label="Buscar por nome da categoria...">
            </div>

            <select class="filtro-select" id="filtroStatus" aria-label="filtroStatus">
              <option value="">Todos os status</option>
              <option value="ativo">Ativas</option>
              <option value="inativo">Inativas</option>
            </select>

            <button
              class="btn btn-secondary"
              id="btnLimpar"
              title="Limpar filtros"
             type="button">
              <i class="fas fa-eraser"></i> Limpar
            </button>

            <button class="btn btn-primary" id="btnNovaCategoria" type="button">
              <i class="fas fa-plus"></i> Nova categoria
            </button>
          </div>

          <!-- GRID DE CATEGORIAS -->
          <div class="categorias-grid" id="categoriasGrid">
            <div class="lista-vazia">
              <i class="fas fa-spinner fa-spin"></i>
              Carregando categorias...
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- NOTIFICAÇÕES -->
    <div class="notification-center" id="notificationCenter"></div>

    <!-- MODAL DE CADASTRO/EDIÇÃO -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h3>
            <i class="fas fa-tags"></i>
            <span id="modalTitulo">Nova categoria</span>
          </h3>
          <button class="btn-fechar" id="btnFecharModal" title="Fechar" type="button">
            <i class="fas fa-xmark"></i>
          </button>
        </div>

        <form id="formCategoria">
          <div class="modal-body">
            <input type="hidden" id="inputId" />

            <!-- NOME -->
            <div class="form-group">
              <label class="form-label" for="inputNome">
                Nome da categoria <span class="required">*</span>
              </label>
              <input
                type="text"
                id="inputNome"
                class="form-input"
                placeholder="Ex: Romance, Infantil, Fantasia..."
                required
                maxlength="100"
              / aria-label="Ex: Romance, Infantil, Fantasia...">
              <span class="form-hint">Nome único. Não pode repetir.</span>
            </div>

            <!-- DESCRIÇÃO -->
            <div class="form-group">
              <label class="form-label" for="inputDescricao">Descrição</label>
              <textarea
                id="inputDescricao"
                class="form-textarea"
                placeholder="Breve descrição sobre o que essa categoria abrange..."
               aria-label="Breve descrição sobre o que essa categoria abrange..."></textarea>
            </div>

            <!-- COR -->
            <div class="form-group">
              <label class="form-label" for="inputCor">
                Cor da categoria <span class="required">*</span>
              </label>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="inputCor"
                  class="color-input"
                  value="#0d5e3a"
                / aria-label="inputCor">
                <input
                  type="text"
                  id="inputCorTexto"
                  class="form-input color-text"
                  value="#0D5E3A"
                  maxlength="7"
                  pattern="^#[0-9A-Fa-f]{6}$"
                / aria-label="inputCorTexto">
              </div>
              <span class="form-hint">
                Usada para destacar tags em listagens e relatórios.
              </span>

              <!-- Presets de cor -->
              <div class="color-presets" id="colorPresets">
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#0d5e3a"

                  title="Verde institucional"
                ></button>
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#1a3a6b"

                  title="Azul institucional"
                ></button>
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#8b5cf6"

                  title="Roxo"
                ></button>
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#06b6d4"

                  title="Ciano"
                ></button>
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#f59e0b"

                  title="Âmbar"
                ></button>
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#ef4444"

                  title="Vermelho"
                ></button>
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#ec4899"

                  title="Rosa"
                ></button>
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#10b981"

                  title="Esmeralda"
                ></button>
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#64748b"

                  title="Cinza"
                ></button>
                <button
                  type="button"
                  class="color-preset"
                  data-cor="#0f172a"

                  title="Preto"
                ></button>
              </div>
            </div>

            <!-- STATUS -->
            <div class="form-group">
              <label class="form-label" for="inputAtivo">Status</label>
              <select id="inputAtivo" class="form-select" aria-label="inputAtivo">
                <option value="true">Ativa</option>
                <option value="false">Inativa</option>
              </select>
              <span class="form-hint">
                Categorias inativas não aparecem ao cadastrar novos livros.
              </span>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="btnCancelar">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary" id="btnSalvar">
              <i class="fas fa-save"></i> Salvar categoria
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- SUPABASE SDK -->
      <script src="../shared/js/system-shell.js?v=20261018-library-identity-3"></script>
  <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <script type="module">
import { supabase } from "../shared/js/supabase.js";
      import { initBibliotecaLayout } from "./biblioteca-layout.js?v=20261018-biblioteca-municipio-unico-1";
      await initBibliotecaLayout(supabase);
      // ============================================
      // CONFIGURAÇÃO SUPABASE
      // ============================================
      // ============================================
      // ESTADO
      // ============================================
      let usuarioLogado = null;
      let categoriasCarregadas = [];

      // ============================================
      // NOTIFICAÇÕES
      // ============================================
      window.showNotification = function (
        type,
        title,
        message,
        duration = 4000,
      ) {
        const container = document.getElementById("notificationCenter");
        if (!container) return;
        const icons = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
        const toast = document.createElement("div");
        toast.className = `notification-toast notification-${type}`;
        toast.innerHTML = `
          <span class="notification-icon">${icons[type]}</span>
          <div class="notification-content">
            <div class="notification-title">${title}</div>
            <div class="notification-message">${message}</div>
          </div>
          <button class="notification-close" type="button">✕</button>
        `;
        container.appendChild(toast);
        toast
          .querySelector(".notification-close")
          .addEventListener("click", () => {
            toast.classList.add("removing");
            setTimeout(() => toast.remove(), 300);
          });
        if (duration > 0) {
          setTimeout(() => {
            if (toast.parentElement) {
              toast.classList.add("removing");
              setTimeout(() => toast.remove(), 300);
            }
          }, duration);
        }
        return toast;
      };

      window.showConfirm = function (title, message, onConfirm) {
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="modal" data-intranet-inline-style="isc62d458ae919">
            <div class="modal-body" data-intranet-inline-style="isbf1491c3d36c">
              <div data-intranet-inline-style="isafb603b9cffe">❓</div>
              <h3 data-intranet-inline-style="iscd0d30d04a11">${title}</h3>
              <p data-intranet-inline-style="is27dd4ab97eb6">${message}</p>
              <div data-intranet-inline-style="isb8dc4ca85911">
                <button class="btn btn-secondary" id="cancelBtn" type="button">Cancelar</button>
                <button class="btn btn-danger" id="confirmBtn" type="button">Confirmar</button>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        const close = () => {
          overlay.style.opacity = "0";
          setTimeout(() => overlay.remove(), 200);
        };
        overlay.querySelector("#cancelBtn").addEventListener("click", close);
        overlay.querySelector("#confirmBtn").addEventListener("click", () => {
          close();
          if (typeof onConfirm === "function") onConfirm();
        });
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) close();
        });
        return overlay;
      };

      // ============================================
      // HELPERS
      // ============================================
      function escaparHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function iniciais(nome) {
        if (!nome) return "?";
        const p = nome.trim().split(/\s+/);
        if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
        return (p[0][0] + p[p.length - 1][0]).toUpperCase();
      }

      function setTexto(id, valor) {
        const el = document.getElementById(id);
        if (el) el.textContent = valor;
      }

      function esconderLoading() {
        document.getElementById("loadingOverlay")?.classList.add("hidden");
      }

      function corValida(hex) {
        return /^#[0-9A-Fa-f]{6}$/.test(hex);
      }

      // ============================================
      // SESSÃO
      // ============================================
      async function verificarSessao() {
        const {
          data: { session },
        } = await supabase.auth.getSession();
        if (!session) {
          window.location.href = "../intranet.html";
          return null;
        }

        const { data: perfil, error } = await supabase
          .from("usuarios")
          .select("id, uuid, nome, email, perfil, ativo")
          .eq("uuid", session.user.id)
          .maybeSingle();

        if (error || !perfil || perfil.ativo === false) {
          window.location.href = "../intranet.html";
          return null;
        }

        usuarioLogado = perfil;
        return perfil;
      }

      function renderizarUsuario() {
        if (!usuarioLogado) return;
        setTexto("topbarNome", usuarioLogado.nome || "—");
        setTexto(
          "topbarData",
          new Date().toLocaleDateString("pt-BR", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          }),
        );
        const el = document.getElementById("avatarIniciais");
        if (el) el.textContent = iniciais(usuarioLogado.nome);

        // Preenche o dropdown do avatar
        setTexto("menuNome", usuarioLogado.nome || "—");
        setTexto("menuEmail", usuarioLogado.email || "—");
      }

      // ============================================
      // MENU DO AVATAR (dropdown)
      // ============================================
      

      // ============================================
      // CARREGAR CATEGORIAS (com contagem de livros)
      // ============================================
      async function carregarCategorias() {
        const grid = document.getElementById("categoriasGrid");
        grid.innerHTML = `
          <div class="lista-vazia">
            <i class="fas fa-spinner fa-spin"></i>
            Carregando categorias...
          </div>`;

        const { data, error } = await supabase
          .from("bib_categorias")
          .select(
            `
            id, nome, descricao, cor, ativo, created_at,
            livros: bib_livro_categorias ( livro_id )
          `,
          )
          .order("nome", { ascending: true });

        if (error) {
          console.error("Erro ao carregar categorias:", error);
          grid.innerHTML = `
            <div class="lista-vazia">
              <i class="fas fa-circle-exclamation"></i>
              Erro ao carregar categorias.<br/>
              <small>${escaparHtml(error.message)}</small>
            </div>`;
          return;
        }

        categoriasCarregadas = data || [];
        aplicarFiltros();
      }

      // ============================================
      // FILTROS
      // ============================================
      function aplicarFiltros() {
        const busca = document
          .getElementById("inputBusca")
          .value.trim()
          .toLowerCase();
        const filtroStatus = document.getElementById("filtroStatus").value;

        let resultado = categoriasCarregadas.slice();

        if (busca) {
          resultado = resultado.filter((c) =>
            (c.nome || "").toLowerCase().includes(busca),
          );
        }

        if (filtroStatus === "ativo") {
          resultado = resultado.filter((c) => c.ativo === true);
        } else if (filtroStatus === "inativo") {
          resultado = resultado.filter((c) => c.ativo === false);
        }

        renderizarGrid(resultado);
      }

      // ============================================
      // RENDERIZAR GRID
      // ============================================
      function renderizarGrid(categorias) {
        const grid = document.getElementById("categoriasGrid");

        if (categorias.length === 0) {
          const total = categoriasCarregadas.length;
          const msg =
            total === 0
              ? "Nenhuma categoria cadastrada ainda. Clique em <strong>Nova categoria</strong> para começar."
              : "Nenhuma categoria encontrada com os filtros atuais.";
          grid.innerHTML = `
            <div class="lista-vazia">
              <i class="fas fa-tags"></i>
              ${msg}
            </div>`;
          return;
        }

        grid.innerHTML = categorias
          .map((c) => {
            const numLivros = (c.livros || []).length;
            const cor = corValida(c.cor) ? c.cor : "#0d5e3a";

            const descricao = c.descricao
              ? `<p class="categoria-descricao">${escaparHtml(c.descricao)}</p>`
              : `<p class="categoria-descricao" data-intranet-inline-style="is1763b8c71166">Sem descrição.</p>`;

            const statusBadge = c.ativo
              ? `<span class="badge badge-verde"><i class="fas fa-circle-check"></i> Ativa</span>`
              : `<span class="badge badge-cinza"><i class="fas fa-circle-minus"></i> Inativa</span>`;

            return `
              <div
                class="categoria-card ${c.ativo ? "" : "inativo"}"
                data-id="${c.id}"
                style="--cor-categoria: ${cor};"
              >
                <div class="categoria-card-header">
                  <div
                    class="categoria-swatch"
                    style="--cor-categoria: ${cor};"
                  >
                    <i class="fas fa-tag"></i>
                  </div>
                  <div class="categoria-info">
                    <h4>${escaparHtml(c.nome)}</h4>
                    <div class="categoria-hex">${escaparHtml(cor.toUpperCase())}</div>
                  </div>
                </div>

                ${descricao}

                <div class="categoria-card-footer">
                  <div class="categoria-stats">
                    <div class="categoria-stat">
                      <span class="num">${numLivros}</span>
                      <span class="lbl">${numLivros === 1 ? "Livro" : "Livros"}</span>
                    </div>
                  </div>
                  <div data-intranet-inline-style="is1f5b08bd9105">
                    ${statusBadge}
                    <div class="acoes-card">
                      <button class="btn-acao editar" data-acao="editar" data-id="${c.id}" title="Editar" type="button">
                        <i class="fas fa-pen"></i>
                      </button>
                      <button class="btn-acao excluir" data-acao="excluir" data-id="${c.id}" title="Excluir" type="button">
                        <i class="fas fa-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>`;
          })
          .join("");

        grid.querySelectorAll("[data-acao='editar']").forEach((btn) => {
          btn.addEventListener("click", () =>
            abrirModalEdicao(parseInt(btn.dataset.id)),
          );
        });
        grid.querySelectorAll("[data-acao='excluir']").forEach((btn) => {
          btn.addEventListener("click", () =>
            confirmarExclusao(parseInt(btn.dataset.id)),
          );
        });
      }

      // ============================================
      // MODAL
      // ============================================
      function atualizarPresetSelecionado(cor) {
        document.querySelectorAll(".color-preset").forEach((el) => {
          el.classList.toggle(
            "selecionado",
            el.dataset.cor.toLowerCase() === cor.toLowerCase(),
          );
        });
      }

      function setCor(valor) {
        if (!corValida(valor)) return;
        document.getElementById("inputCor").value = valor;
        document.getElementById("inputCorTexto").value = valor.toUpperCase();
        atualizarPresetSelecionado(valor);
      }

      function limparFormulario() {
        document.getElementById("formCategoria").reset();
        document.getElementById("inputId").value = "";
        document.getElementById("inputAtivo").value = "true";
        setCor("#0D5E3A");
      }

      function abrirModalNova() {
        limparFormulario();
        document.getElementById("modalTitulo").textContent = "Nova categoria";
        document.getElementById("modalOverlay").style.display = "flex";
        setTimeout(() => document.getElementById("inputNome").focus(), 100);
      }

      function abrirModalEdicao(id) {
        const cat = categoriasCarregadas.find((c) => c.id === id);
        if (!cat) return;

        limparFormulario();
        document.getElementById("modalTitulo").textContent = "Editar categoria";
        document.getElementById("inputId").value = cat.id;
        document.getElementById("inputNome").value = cat.nome || "";
        document.getElementById("inputDescricao").value = cat.descricao || "";
        document.getElementById("inputAtivo").value = cat.ativo
          ? "true"
          : "false";
        setCor(cat.cor && corValida(cat.cor) ? cat.cor : "#0D5E3A");

        document.getElementById("modalOverlay").style.display = "flex";
        setTimeout(() => document.getElementById("inputNome").focus(), 100);
      }

      function fecharModal() {
        document.getElementById("modalOverlay").style.display = "none";
      }

      // ============================================
      // COLOR PICKER · SINCRONIZAÇÃO
      // ============================================
      document.getElementById("inputCor").addEventListener("input", (e) => {
        const v = e.target.value;
        document.getElementById("inputCorTexto").value = v.toUpperCase();
        atualizarPresetSelecionado(v);
      });

      document
        .getElementById("inputCorTexto")
        .addEventListener("input", (e) => {
          let v = e.target.value.trim();
          if (v && !v.startsWith("#")) v = "#" + v;
          if (corValida(v)) {
            document.getElementById("inputCor").value = v;
            atualizarPresetSelecionado(v);
          }
        });

      document.querySelectorAll(".color-preset").forEach((btn) => {
        btn.addEventListener("click", () => setCor(btn.dataset.cor));
      });

      // ============================================
      // SALVAR
      // ============================================
      document
        .getElementById("formCategoria")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const btnSalvar = document.getElementById("btnSalvar");
          const id = document.getElementById("inputId").value;
          const nome = document.getElementById("inputNome").value.trim();
          const corTexto = document
            .getElementById("inputCorTexto")
            .value.trim()
            .toUpperCase();

          if (!nome) {
            window.showNotification(
              "warning",
              "Campo obrigatório",
              "Informe o nome da categoria.",
            );
            return;
          }

          if (!corValida(corTexto)) {
            window.showNotification(
              "warning",
              "Cor inválida",
              "A cor deve estar no formato hexadecimal (ex: #0D5E3A).",
            );
            return;
          }

          btnSalvar.disabled = true;
          btnSalvar.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Salvando...`;

          try {
            const dados = {
              nome,
              descricao:
                document.getElementById("inputDescricao").value.trim() || null,
              cor: corTexto,
              ativo: document.getElementById("inputAtivo").value === "true",
            };

            if (id) {
              const { error } = await supabase
                .from("bib_categorias")
                .update(dados)
                .eq("id", parseInt(id));
              if (error) throw error;

              window.showNotification(
                "success",
                "Categoria atualizada",
                `"${nome}" foi atualizada com sucesso.`,
              );
            } else {
              const { error } = await supabase
                .from("bib_categorias")
                .insert(dados);
              if (error) throw error;

              window.showNotification(
                "success",
                "Categoria cadastrada",
                `"${nome}" foi adicionada ao cadastro.`,
              );
            }

            fecharModal();
            await carregarCategorias();
          } catch (err) {
            console.error(err);

            // Detecta conflito de nome único
            if (err.code === "23505" || /duplicate key/i.test(err.message)) {
              window.showNotification(
                "error",
                "Nome já existe",
                "Já existe uma categoria com este nome. Escolha outro.",
              );
            } else {
              window.showNotification(
                "error",
                "Erro ao salvar",
                err.message || "Não foi possível salvar a categoria.",
              );
            }
          } finally {
            btnSalvar.disabled = false;
            btnSalvar.innerHTML = `<i class="fas fa-save"></i> Salvar categoria`;
          }
        });

      // ============================================
      // EXCLUIR
      // ============================================
      async function confirmarExclusao(id) {
        const cat = categoriasCarregadas.find((c) => c.id === id);
        if (!cat) return;

        const numLivros = (cat.livros || []).length;
        if (numLivros > 0) {
          window.showNotification(
            "error",
            "Não é possível excluir",
            `Esta categoria está vinculada a ${numLivros} livro(s). Remova o vínculo nos livros antes de excluir.`,
            6000,
          );
          return;
        }

        window.showConfirm(
          "Excluir categoria",
          `Deseja realmente excluir "${escaparHtml(cat.nome)}"? Esta ação não pode ser desfeita.`,
          async () => {
            try {
              const { error } = await supabase
                .from("bib_categorias")
                .delete()
                .eq("id", id);
              if (error) throw error;

              window.showNotification(
                "success",
                "Categoria excluída",
                `"${cat.nome}" foi removida do cadastro.`,
              );
              await carregarCategorias();
            } catch (err) {
              console.error(err);
              window.showNotification(
                "error",
                "Erro ao excluir",
                err.message || "Não foi possível excluir a categoria.",
              );
            }
          },
        );
      }

      // ============================================
      // EVENTOS
      // ============================================
      document
        .getElementById("btnNovaCategoria")
        .addEventListener("click", abrirModalNova);
      document
        .getElementById("btnFecharModal")
        .addEventListener("click", fecharModal);
      document
        .getElementById("btnCancelar")
        .addEventListener("click", fecharModal);

      document.getElementById("modalOverlay").addEventListener("click", (e) => {
        if (e.target.id === "modalOverlay") fecharModal();
      });

      document
        .getElementById("inputBusca")
        .addEventListener("input", aplicarFiltros);
      document
        .getElementById("filtroStatus")
        .addEventListener("change", aplicarFiltros);

      document.getElementById("btnLimpar").addEventListener("click", () => {
        document.getElementById("inputBusca").value = "";
        document.getElementById("filtroStatus").value = "";
        aplicarFiltros();
      });

      // Toggle sidebar mobile

      // ESC fecha modal
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") fecharModal();
      });

      // ============================================
      // INICIALIZAÇÃO
      // ============================================
      async function init() {
        try {
          const usuario = await verificarSessao();
          if (!usuario) return;

          renderizarUsuario();
await carregarCategorias();
        } catch (err) {
          console.error("Erro na inicialização:", err);
          window.showNotification(
            "error",
            "Erro inesperado",
            "Não foi possível inicializar a página.",
          );
        } finally {
          esconderLoading();
        }
      }

      init();
    </script>
      
  </body>
</html>
